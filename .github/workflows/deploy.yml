name: Deploy website

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:prod
        env:
          CI: false
          REACT_APP_TMDB_API_KEY: ${{ secrets.REACT_APP_TMDB_API_KEY || vars.REACT_APP_TMDB_API_KEY }}
          REACT_APP_K_REST_API_KEY: ${{ secrets.REACT_APP_K_REST_API_KEY || vars.REACT_APP_K_REST_API_KEY }}
          REACT_APP_REDIRECT_URI: ${{ secrets.REACT_APP_REDIRECT_URI || vars.REACT_APP_REDIRECT_URI }}

      - name: Publish to Pages source
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: master
          destination_dir: docs
          keep_files: true
